name: dbt broom wagon
description: Select the dbt nodes whose last successful build is missing or predates a parent's code change.

inputs:
  source:
    description: Where the run history comes from, dbt-cloud or local.
    default: dbt-cloud
  runs-dir:
    description: Folder of saved runs, one folder per run id, for source local.
    default: ""
  account-id:
    description: dbt Cloud account id, for source dbt-cloud.
    default: ""
  job-id:
    description: dbt Cloud job whose runs make up the history, for source dbt-cloud.
    default: ""
  api-token:
    description: dbt Cloud service token that can read runs and artifacts, for source dbt-cloud.
    default: ""
  host:
    description: dbt Cloud access URL host.
    default: cloud.getdbt.com
  manifest-path:
    description: Manifest of the commit being deployed.
    default: target/manifest.json
  max-runs:
    description: Most runs with build steps to read.
    default: "30"
  credit-on:
    description: model or model-and-tests.
    default: model
  include-unrun:
    description: Also select nodes the job has not run in the runs read.
    default: "false"
  macro-sensitive:
    description: Space-separated materialisations whose nodes also count edits to the macros they call.
    default: ""

outputs:
  select:
    description: The --select string. Empty when nothing needs building.
    value: ${{ steps.select.outputs.select }}
  count:
    description: Number of selected nodes.
    value: ${{ steps.select.outputs.count }}
  json-path:
    description: Path to the JSON output with every node and its reason.
    value: ${{ steps.select.outputs.json-path }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6

    - if: inputs.source == 'dbt-cloud'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/broom-wagon-cache/${{ inputs.account-id }}-${{ inputs.job-id }}
        key: broom-wagon-${{ inputs.account-id }}-${{ inputs.job-id }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: broom-wagon-${{ inputs.account-id }}-${{ inputs.job-id }}-

    - id: select
      shell: bash
      env:
        DBT_CLOUD_API_TOKEN: ${{ inputs.api-token }}
        BW_ACTION_PATH: ${{ github.action_path }}
        BW_SOURCE: ${{ inputs.source }}
        BW_RUNS_DIR: ${{ inputs.runs-dir }}
        BW_ACCOUNT_ID: ${{ inputs.account-id }}
        BW_JOB_ID: ${{ inputs.job-id }}
        BW_HOST: ${{ inputs.host }}
        BW_CACHE_DIR: ${{ runner.temp }}/broom-wagon-cache/${{ inputs.account-id }}-${{ inputs.job-id }}
        BW_MANIFEST: ${{ inputs.manifest-path }}
        BW_MAX_RUNS: ${{ inputs.max-runs }}
        BW_CREDIT_ON: ${{ inputs.credit-on }}
        BW_INCLUDE_UNRUN: ${{ inputs.include-unrun }}
        BW_MACRO_SENSITIVE: ${{ inputs.macro-sensitive }}
      run: |
        out="$(mktemp -d "$RUNNER_TEMP/broom-wagon.XXXXXX")/selection.json"
        args=(select --source "$BW_SOURCE"
          --manifest "$BW_MANIFEST" --max-runs "$BW_MAX_RUNS" --credit-on "$BW_CREDIT_ON"
          --format json --out "$out" --github-output)
        if [ "$BW_SOURCE" = "dbt-cloud" ]; then
          args+=(--host "$BW_HOST" --cache-dir "$BW_CACHE_DIR")
        fi
        if [ -n "$BW_RUNS_DIR" ]; then args+=(--runs-dir "$BW_RUNS_DIR"); fi
        if [ -n "$BW_ACCOUNT_ID" ]; then args+=(--account-id "$BW_ACCOUNT_ID"); fi
        if [ -n "$BW_JOB_ID" ]; then args+=(--job-id "$BW_JOB_ID"); fi
        if [ "$BW_INCLUDE_UNRUN" = "true" ]; then args+=(--include-unrun); fi
        for m in $BW_MACRO_SENSITIVE; do args+=(--macro-sensitive "$m"); done
        uv run --project "$BW_ACTION_PATH" --frozen broom-wagon "${args[@]}"
        echo "json-path=$out" >> "$GITHUB_OUTPUT"
