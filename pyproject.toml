[project]
name = "dbt-broom-wagon"
version = "0.4.1"
description = "Select the dbt nodes whose last successful build is missing or predates a parent's code change."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["click>=8.2", "httpx>=0.28"]

[project.scripts]
broom-wagon = "broom_wagon.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/broom_wagon"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
